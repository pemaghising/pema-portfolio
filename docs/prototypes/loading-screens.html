<title>Mixtape Loading Screens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* Layout: a contact sheet of four loading screens, each a 16:10 "screen", replayable. Single studio look on purpose. */
:root{
  --studio:#E5E3DE; --paper:#F2ECDF; --alu:#C9CDD3; --shell:#26262A; --graphite:#1B1B1E; --ink2:#55534D;
  --foam:#F26A21; --mustard:#E9AE0B; --teal:#14A39E; --tape:#3B2A20;
  --lcd:#9AA35A; --lcd-ink:#2C3410; --vhs:#1736B5;
  --display:'Dela Gothic One','Arial Black',sans-serif;
  --pixel:'DotGothic16',ui-monospace,monospace;
  --text:'Zen Kaku Gothic New','Helvetica Neue',Arial,sans-serif;
  color-scheme:light;
}
html,body{background:var(--studio);color:var(--graphite)}
body{font-family:var(--text);font-weight:500;padding-inline:clamp(16px,4vw,48px);padding-block:40px 64px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,4.4vw,56px);line-height:1;margin:0;text-wrap:balance}
.k{font-family:var(--pixel);font-size:14px;letter-spacing:.2em;color:var(--ink2);margin:0 0 14px}
.intro{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:32px}
.intro p{max-width:52ch;margin:12px 0 0;line-height:1.55}
button{font:700 11px/1 var(--text);letter-spacing:.14em;text-transform:uppercase;color:var(--graphite);background:transparent;border:1.5px solid var(--graphite);border-radius:99px;height:36px;padding:0 16px;cursor:pointer}
button:hover{background:var(--graphite);color:var(--studio)}
button:focus-visible{outline:2px solid var(--foam);outline-offset:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:36px 28px}
figure{margin:0;display:grid;gap:14px;min-width:0}
.scr{position:relative;aspect-ratio:16/10;max-width:100%;border-radius:14px;overflow:hidden;container-type:inline-size;box-shadow:0 2px 0 rgba(0,0,0,.18),0 24px 40px -24px rgba(0,0,0,.45)}
figcaption{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:start}
figcaption .l{font-family:var(--display);font-size:20px;line-height:1}
figcaption .no{font-family:var(--pixel);font-size:15px;color:var(--ink2);padding-top:2px}
figcaption p{margin:6px 0 0;font-size:14px;line-height:1.5;color:var(--ink2)}
figcaption b{color:var(--graphite)}
.pick{display:inline-block;margin-left:8px;font:700 10px/1 var(--text);letter-spacing:.14em;text-transform:uppercase;background:var(--foam);color:var(--graphite);padding:4px 7px;border-radius:99px;vertical-align:3px}

/* ---------- A · Rewind: the cassette window ---------- */
.a{background:radial-gradient(110% 80% at 50% 40%,#EFEDE9,var(--studio) 60%,#D7D4CD)}
.a .cas{position:absolute;left:50%;top:46%;width:62cqi;aspect-ratio:2.56/1.6;translate:-50% -50%;border-radius:2.2cqi;background:linear-gradient(180deg,#34343A,var(--shell));box-shadow:inset 0 0 0 .3cqi rgba(255,255,255,.08),0 2cqi 3cqi -1.5cqi rgba(0,0,0,.5)}
.a .cas::before{content:"";position:absolute;left:22%;right:22%;bottom:0;height:22%;background:#1f1f23;clip-path:polygon(8% 0,92% 0,100% 100%,0 100%);box-shadow:inset 0 .3cqi 0 rgba(255,255,255,.06)}
.a .cas::after{content:"";position:absolute;inset:3.5%;border-radius:1.2cqi;pointer-events:none;
  background:radial-gradient(circle at 1.4cqi 1.4cqi,#8d8f94 0 .55cqi,transparent .65cqi) 0 0/100% 100% no-repeat,radial-gradient(circle at calc(100% - 1.4cqi) 1.4cqi,#8d8f94 0 .55cqi,transparent .65cqi),radial-gradient(circle at 1.4cqi calc(100% - 1.4cqi),#8d8f94 0 .55cqi,transparent .65cqi),radial-gradient(circle at calc(100% - 1.4cqi) calc(100% - 1.4cqi),#8d8f94 0 .55cqi,transparent .65cqi)}
.a .lab{position:absolute;inset:7% 6% 30%;border-radius:1.2cqi;background:var(--paper);display:grid;grid-template-rows:auto auto 1fr;padding:3.5% 5% 0}
.a .st{display:grid;gap:.5cqi}.a .st i{height:.8cqi;background:var(--foam)}.a .st i:nth-child(2){background:var(--mustard)}.a .st i:nth-child(3){background:var(--teal)}
.a .nm{font-family:var(--display);font-size:3.6cqi;margin-top:1.6cqi;display:flex;justify-content:space-between;align-items:baseline}
.a .nm small{font:700 1.5cqi var(--text);letter-spacing:.1em;color:var(--ink2)}
.a .win{position:relative;margin:1.4cqi auto 0;width:58%;height:9cqi;border-radius:1cqi;background:#141416;box-shadow:inset 0 0 0 .35cqi #0b0b0c;overflow:hidden}
.a .reel{position:absolute;top:50%;width:var(--d);aspect-ratio:1;border-radius:50%;translate:-50% -50%;background:radial-gradient(circle,#F4F1EA 0 23%,transparent 24%),var(--tape)}
.a .reel::after{content:"";position:absolute;inset:38%;border-radius:50%;background:repeating-conic-gradient(#141416 0 14deg,transparent 14deg 60deg);animation:spin .5s linear infinite}
.a .r1{left:30%;--d:8.4cqi}.a .r2{left:70%;--d:4.2cqi}
.a.go .r1{animation:shrink 1.9s cubic-bezier(.4,0,.3,1) forwards}.a.go .r2{animation:grow 1.9s cubic-bezier(.4,0,.3,1) forwards}
@keyframes shrink{to{--d:4.2cqi}}@keyframes grow{to{--d:8.4cqi}}
@property --d{syntax:"<length>";inherits:false;initial-value:6cqi}
.a .read{position:absolute;left:0;right:0;bottom:9%;display:flex;justify-content:center;gap:2.4cqi;align-items:center;font-family:var(--pixel);font-size:2.4cqi;letter-spacing:.14em;color:var(--ink2)}
.a .ctr{display:inline-flex;gap:.4cqi}.a .ctr span{background:var(--graphite);color:var(--paper);padding:.3cqi .7cqi;border-radius:.4cqi;font-size:2.6cqi}
.a .ff{color:var(--foam);animation:blink .5s steps(1) infinite}
.a.go .cas{animation:out .5s 1.95s cubic-bezier(.5,0,.75,0) forwards}
@keyframes out{to{scale:1.35;opacity:0}}

/* ---------- B · Deck: LCD, VU meters, LED ladder ---------- */
.b{background:linear-gradient(180deg,#D3D6DB,var(--alu));display:grid;place-items:center}
.b .panel{width:84cqi;aspect-ratio:2.5/1;border-radius:2cqi;background:#141416;box-shadow:inset 0 0 0 .5cqi #2a2a2f,0 1.2cqi 2cqi -1cqi rgba(0,0,0,.5);display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:2.4cqi;padding:3cqi;align-items:center}
.b .vu{position:relative;aspect-ratio:1.5/1;border-radius:1cqi;background:radial-gradient(120% 120% at 50% 110%,#F6E9C9,#E8D3A0);overflow:hidden;box-shadow:inset 0 0 0 .3cqi #000}
.b .vu::before{content:"";position:absolute;left:50%;bottom:-62%;width:150%;aspect-ratio:1;translate:-50% 0;border-radius:50%;
  background:repeating-conic-gradient(from -50deg,#2b2b2b 0 .6deg,transparent .6deg 6deg);-webkit-mask:radial-gradient(circle,transparent 60%,#000 61% 66%,transparent 67%);mask:radial-gradient(circle,transparent 60%,#000 61% 66%,transparent 67%)}
.b .vu::after{content:"";position:absolute;right:12%;top:20%;width:24%;height:6%;background:#D7322D;border-radius:2px;opacity:.8}
.b .vu i{position:absolute;left:50%;bottom:-20%;width:.35cqi;height:88%;background:#141416;transform-origin:50% 100%;rotate:-48deg;border-radius:2px}
.b.go .vu i{animation:needle 2.1s ease-out forwards}.b.go .vu:last-child i{animation-name:needle2}
@keyframes needle{0%{rotate:-48deg}18%{rotate:-10deg}28%{rotate:-26deg}40%{rotate:8deg}52%{rotate:-14deg}64%{rotate:18deg}76%{rotate:-4deg}88%{rotate:24deg}100%{rotate:-6deg}}
@keyframes needle2{0%{rotate:-48deg}14%{rotate:-18deg}30%{rotate:4deg}44%{rotate:-22deg}58%{rotate:12deg}70%{rotate:-8deg}84%{rotate:28deg}100%{rotate:-2deg}}
.b .vu b{position:absolute;left:8%;bottom:8%;font:700 1.4cqi var(--text);letter-spacing:.1em}
.b .lcd{border-radius:1cqi;background:#1d0d05;box-shadow:inset 0 0 0 .3cqi #000,inset 0 0 3cqi rgba(242,106,33,.15);padding:2cqi 2.2cqi;color:var(--foam);font-family:var(--pixel);text-shadow:0 0 1cqi rgba(242,106,33,.6);display:grid;gap:1.2cqi}
.b .lcd .row{display:flex;justify-content:space-between;font-size:1.8cqi;letter-spacing:.12em}
.b .lcd .big{white-space:nowrap;font-size:4.6cqi;line-height:.9;letter-spacing:.04em}
.b .lcd .row span:first-child{opacity:.75}
.b .leds{display:grid;grid-template-columns:repeat(16,1fr);gap:.45cqi}
.b .leds i{height:1.1cqi;border-radius:1px;background:#3a1a0a}
.b.go .leds i{animation:led .01s calc(var(--n)*.11s) forwards}
@keyframes led{to{background:var(--foam);box-shadow:0 0 .8cqi rgba(242,106,33,.8)}}
.b .cap{position:absolute;left:8cqi;right:8cqi;bottom:4.5cqi;display:flex;justify-content:space-between;font:700 1.5cqi var(--text);letter-spacing:.16em;color:#3a3d42}

/* ---------- C · Power on: a handheld's start-up ---------- */
.c{background:linear-gradient(180deg,#DCDAD3,#CFCCC4);display:grid;place-items:center}
.c .dev{width:70cqi;aspect-ratio:1.55/1;border-radius:2cqi 2cqi 7cqi 2cqi;background:#BDBFC2;box-shadow:inset 0 0 0 .4cqi rgba(255,255,255,.4),0 1.4cqi 2cqi -1cqi rgba(0,0,0,.4);padding:3.6cqi 4.5cqi 3cqi 9cqi;position:relative}
.c .pw{position:absolute;left:2.4cqi;top:38%;display:grid;gap:.8cqi;justify-items:center;font:700 1.2cqi var(--text);letter-spacing:.12em;color:#4a4c55}
.c .pw i{width:1.4cqi;height:1.4cqi;border-radius:50%;background:#5a1d1a}
.c.go .pw i{animation:pwr .01s .15s forwards}
@keyframes pwr{to{background:#E5322D;box-shadow:0 0 1.2cqi #E5322D}}
.c .lcdw{height:100%;border-radius:1cqi;background:#5c5f6a;padding:2cqi;display:grid}
.c .lcd{position:relative;border-radius:.4cqi;background:var(--lcd);overflow:hidden;
  background-image:linear-gradient(rgba(0,0,0,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.06) 1px,transparent 1px);background-size:.6cqi .6cqi}
.c .lcd::before{content:"";position:absolute;inset:0;background:#7E864A;opacity:1}
.c.go .lcd::before{animation:lcdon .4s .2s steps(3) forwards}
@keyframes lcdon{to{opacity:0}}
.c .logo{position:absolute;left:0;right:0;top:38%;text-align:center;font-family:var(--pixel);font-size:5.4cqi;letter-spacing:.06em;color:var(--lcd-ink);translate:0 -260%}
.c.go .logo{animation:drop 1.4s .35s steps(14) forwards}
@keyframes drop{to{translate:0 0}}
.c .sub{position:absolute;left:0;right:0;top:63%;text-align:center;font-family:var(--pixel);font-size:2cqi;letter-spacing:.3em;color:var(--lcd-ink);opacity:0}
.c.go .sub{animation:show .01s 1.85s forwards}
@keyframes show{to{opacity:1}}
.c .brand{position:absolute;right:5cqi;bottom:.9cqi;font:700 1.25cqi var(--text);letter-spacing:.16em;color:#4a4c55}

/* ---------- D · VHS: press play ---------- */
.d{background:#0a0a0c}
.d canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.d .osd{position:absolute;inset:6cqi 7cqi;font-family:var(--pixel);color:#fff;font-size:3.4cqi;letter-spacing:.08em;text-shadow:.25cqi .25cqi 0 rgba(0,0,0,.5)}
.d .osd .tl{position:absolute;left:0;top:0}.d .osd .tr{position:absolute;right:0;top:0}.d .osd .bl{position:absolute;left:0;bottom:0}.d .osd .br{position:absolute;right:0;bottom:0;font-size:2.4cqi}
.d .trk{position:absolute;left:18%;right:18%;top:58%;display:grid;gap:1cqi;justify-items:center;font-family:var(--pixel);color:#fff;font-size:2.4cqi;letter-spacing:.2em;opacity:0}
.d .trk i{display:block;width:100%;height:1.6cqi;background:linear-gradient(90deg,#fff 0 var(--t,30%),rgba(255,255,255,.18) 0)}
.d.go .trk{animation:trk 1.1s .2s steps(1) forwards}
@keyframes trk{0%{opacity:1}100%{opacity:0}}
.d .title{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:1cqi;opacity:0}
.d .title h3{margin:0;font-family:var(--display);font-weight:400;color:#fff;font-size:8cqi;letter-spacing:.01em;text-shadow:-.5cqi 0 rgba(255,40,60,.75),.5cqi 0 rgba(0,220,255,.6)}
.d .title p{margin:0;font-family:var(--pixel);color:#fff;font-size:2.2cqi;letter-spacing:.3em}
.d.go .title{animation:lock .9s 1.25s forwards}
@keyframes lock{0%{opacity:0;translate:4cqi 0;filter:blur(.4cqi)}30%{opacity:1;translate:-2cqi 0}55%{translate:1cqi 0;filter:blur(0)}100%{opacity:1;translate:0 0}}
.d .scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px);pointer-events:none}

@keyframes spin{to{rotate:-360deg}}@keyframes blink{50%{opacity:0}}
.replay{position:absolute;right:2.2cqi;top:2.2cqi;z-index:5;height:30px;padding:0 12px;background:rgba(229,227,222,.9)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}}
</style>

<div class="intro">
  <div>
    <p class="k">ペマ・ギシン · LOADING SCREEN · 4 TAKES</p>
    <h1>Pick the tape that loads the site</h1>
    <p>Each one runs about two seconds, then hands over to the hero where the cassette flies in. All four use the site's colours and type. Press Replay on any screen to watch it again.</p>
  </div>
  <button type="button" id="all">Replay all</button>
</div>

<div class="grid">
  <figure>
    <div class="scr a" id="A">
      <button class="replay" type="button" data-r="A">Replay</button>
      <div class="cas">
        <div class="lab">
          <div class="st"><i></i><i></i><i></i></div>
          <div class="nm">PEMA GHISING <small>SIDE A</small></div>
          <div class="win"><span class="reel r1"></span><span class="reel r2"></span></div>
        </div>
      </div>
      <div class="read"><span class="ff">▶▶</span><span>WINDING TO SIDE A</span><span class="ctr"><span>0</span><span>0</span><span class="cnt">0</span></span></div>
    </div>
    <figcaption><span class="no">A</span><div><span class="l">Rewind</span><span class="pick">Closest to the hero</span><p>A close-up of your cassette. The tape winds from one reel to the other while the counter rolls to 007, then the tape zooms out of frame. <b>Mood board:</b> cassettes, collecting music.</p></div></figcaption>
  </figure>

  <figure>
    <div class="scr b" id="B">
      <button class="replay" type="button" data-r="B">Replay</button>
      <div class="panel">
        <div class="vu"><i></i><b>L</b></div>
        <div class="lcd">
          <div class="row"><span>PG-001</span><span>TYPE II</span></div>
          <div class="big">SIDE A <span class="cnt">000</span></div>
          <div class="leds"></div>
        </div>
        <div class="vu"><i></i><b>R</b></div>
      </div>
      <div class="cap"><span>Stereo cassette deck</span><span>Pema Ghising</span></div>
    </div>
    <figcaption><span class="no">B</span><div><span class="l">Deck</span><p>A hi-fi tape deck wakes up. VU needles jump, the orange display counts to 007 and the LED ladder fills as the site loads. <b>Mood board:</b> synth modules, 80s hi-fi.</p></div></figcaption>
  </figure>

  <figure>
    <div class="scr c" id="C">
      <button class="replay" type="button" data-r="C">Replay</button>
      <div class="dev">
        <div class="pw"><i></i>POWER</div>
        <div class="lcdw"><div class="lcd"><div class="logo">PEMA GHISING</div><div class="sub">PG-001 · SIDE A</div></div></div>
        <div class="brand">STEREO PORTFOLIO</div>
      </div>
    </div>
    <figcaption><span class="no">C</span><div><span class="l">Power on</span><p>A handheld switches on: the red light comes on, the green screen warms up and your name scrolls down in chunky steps, like an old game console starting up. <b>Mood board:</b> handheld consoles, retro games.</p></div></figcaption>
  </figure>

  <figure>
    <div class="scr d" id="D">
      <button class="replay" type="button" data-r="D">Replay</button>
      <canvas width="160" height="100"></canvas>
      <div class="osd"><span class="tl">PLAY ▶</span><span class="tr">SP</span><span class="bl"><span class="cnt">0:00:00</span></span><span class="br">CH 07</span></div>
      <div class="trk"><span>TRACKING</span><i></i></div>
      <div class="title"><h3>PEMA GHISING</h3><p>GRAPHIC &amp; MOTION DESIGNER</p></div>
      <div class="scan"></div>
    </div>
    <figcaption><span class="no">D</span><div><span class="l">Press play</span><p>A VHS tape starts: static, the white PLAY overlay, a tracking bar, then the picture locks onto your name with a slight colour fringe. <b>Mood board:</b> 80s movies, tapes as collectables.</p></div></figcaption>
  </figure>
</div>

<script>
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
// LED ladder
const leds = document.querySelector('#B .leds');
for (let i = 0; i < 16; i++) { const e = document.createElement('i'); e.style.setProperty('--n', i); leds.appendChild(e); }
// VHS noise
const cv = document.querySelector('#D canvas'), cx = cv.getContext('2d'), img = cx.createImageData(160, 100);
let vhsT0 = 0;
function noise(t) {
  const k = Math.min(1, (t - vhsT0) / 1300); // noise fades as the picture locks
  const band = (t / 6) % 120 - 10;
  for (let y = 0; y < 100; y++) for (let x = 0; x < 160; x++) {
    const i = (y * 160 + x) * 4, inBand = Math.abs(y - band) < 6;
    const n = Math.random() * 255 * (1 - k * 0.92) * (inBand ? 1.3 : 1);
    img.data[i] = n * .35 + k * 23; img.data[i + 1] = n * .35 + k * 54; img.data[i + 2] = n * .45 + k * 181; img.data[i + 3] = 255;
  }
  cx.putImageData(img, 0, 0);
}
let rafs = {};
function counter(el, fmt, ms) {
  const t0 = performance.now();
  const step = now => { const p = Math.min(1, (now - t0) / ms); el.textContent = fmt(Math.min(7, Math.floor(p * 8))); if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function play(id) {
  const s = document.getElementById(id);
  s.classList.remove('go'); void s.offsetWidth; s.classList.add('go');
  const ms = reduce ? 1 : 1800;
  if (id === 'A') counter(s.querySelector('.ctr .cnt'), n => n, ms);
  if (id === 'B') counter(s.querySelector('.big .cnt'), n => '00' + n, ms);
  if (id === 'D') {
    counter(s.querySelector('.cnt'), n => '0:00:0' + n, ms);
    vhsT0 = performance.now(); cancelAnimationFrame(rafs.D);
    const tr = s.querySelector('.trk i'); const t0 = performance.now();
    const loop = t => { noise(t); tr.style.setProperty('--t', Math.min(100, (t - t0) / 9) + '%'); if (t - vhsT0 < 2600 && !reduce) rafs.D = requestAnimationFrame(loop); else noise(vhsT0 + 99999); };
    rafs.D = requestAnimationFrame(loop);
  }
}
document.querySelectorAll('[data-r]').forEach(b => b.addEventListener('click', () => play(b.dataset.r)));
document.getElementById('all').addEventListener('click', () => ['A', 'B', 'C', 'D'].forEach(play));
// play each screen when it scrolls into view
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { play(e.target.id); io.unobserve(e.target); } }), { threshold: .5 });
['A', 'B', 'C', 'D'].forEach(id => io.observe(document.getElementById(id)));
</script>
